[theme]
# Palette follows a validated light-surface set: accessible accent blue on
# near-white surfaces, near-black primary ink.
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans-serif"

[browser]
gatherUsageStats = false
